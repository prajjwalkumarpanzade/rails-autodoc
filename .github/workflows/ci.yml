name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.2", "3.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          bundler: "2.6.9"
      - name: Run RuboCop
        run: bundle exec rubocop
      - name: Run specs
        run: bundle exec rspec
      - name: Verify generated OpenAPI spec
        run: bundle exec rake autodoc:verify

  appraisal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        appraisal: ["rails-7-0", "rails-7-1", "rails-8-0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler: "2.6.9"
          bundler-cache: true
      - name: Generate appraisal gemfiles
        run: bundle exec appraisal generate
      - name: Install appraisal gemfile
        run: bundle exec appraisal ${{ matrix.appraisal }} bundle install
      - name: Run appraisal specs
        run: bundle exec appraisal ${{ matrix.appraisal }} rake spec
