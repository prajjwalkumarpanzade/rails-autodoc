name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.2", "3.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          bundler: "2.6.9"
      - name: Run RuboCop
        run: bundle exec rubocop
      - name: Run specs
        run: bundle exec rspec
      - name: Verify generated OpenAPI spec
        run: bundle exec rake autodoc:verify

  appraisal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          bundler: "2.6.9"
      - name: Install appraisal gemfiles
        run: bundle exec appraisal install
      - name: Run appraisal specs
        run: bundle exec appraisal rake spec
